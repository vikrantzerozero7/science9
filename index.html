<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0710">
<title>Science 9 · Diagrams</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body { overflow-x: hidden; }

  body {
    background: radial-gradient(circle at 50% 20%, #14101e, #0a0710 70%);
    min-height: 100vh;
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    color: #e8dce8;
    padding: 1rem 0.75rem calc(1.5rem + env(safe-area-inset-bottom));
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  header {
    text-align: center;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-size: 0.85rem;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ff9ec0;
    margin-bottom: 0.3rem;
  }
  .sub {
    font-size: 0.58rem;
    letter-spacing: 2px;
    color: #7a6a80;
    text-transform: uppercase;
  }

  /* ---- GRID ---- */
  .grid {
    max-width: 1300px;
    margin: 0 auto;
    display: grid;
    gap: 0.9rem;
    grid-template-columns: 1fr;   /* mobile default */
  }
  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  }
  @media (min-width: 1000px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
    h1 { font-size: 1rem; letter-spacing: 6px; }
  }

  /* ---- CARD ---- */
  .card {
    background: linear-gradient(150deg, rgba(30,22,38,.95), rgba(14,10,20,.98));
    border-radius: 14px;
    padding: 0.85rem;
    box-shadow: 0 0 0 1px rgba(255,120,160,.14), 0 14px 30px -14px #000;
    display: flex;
    flex-direction: column;
    transition: transform .25s, box-shadow .25s;
  }
  @media (hover: hover) {
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 1px rgba(255,120,160,.35), 0 20px 40px -18px #000;
    }
  }
  .card h3 {
    font-size: 0.72rem;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #ff9ec0;
    font-weight: 500;
    margin-bottom: 0.15rem;
    line-height: 1.3;
    word-wrap: break-word;
  }
  .concept {
    font-size: 0.55rem;
    letter-spacing: 0.8px;
    color: #8a7a90;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    line-height: 1.3;
  }

  /* ---- SVG BOX ---- */
  .svg-box {
    background: rgba(8,6,14,.7);
    border-radius: 10px;
    padding: 0.4rem;
    border: 1px solid rgba(255,120,160,.1);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 160px;
  }
  .svg-box svg {
    width: 100%;
    height: auto;
    max-height: 220px;
    display: block;
  }
  @media (max-width: 480px) {
    .svg-box svg { max-height: 240px; }
    .card { padding: 0.75rem; }
  }

  .caption {
    font-size: 0.6rem;
    color: #b8a8bc;
    margin-top: 0.5rem;
    line-height: 1.45;
    text-align: center;
  }
  .tag {
    display: inline-block;
    font-size: 0.52rem;
    letter-spacing: 1px;
    padding: 0.14rem 0.5rem;
    border-radius: 20px;
    margin-top: 0.5rem;
    align-self: flex-start;
    text-transform: uppercase;
  }

  /* ---- FALLBACK ---- */
  .error {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: #ff8899;
    font-size: 0.85rem;
    line-height: 1.7;
  }
  .error code {
    background: rgba(255,120,140,.1);
    padding: 0.2rem 0.45rem;
    border-radius: 5px;
    font-size: 0.8rem;
    color: #ffb8cc;
  }
</style>

  // ---------- RENDER ----------
  function render() {
    const cfg = window.SCIENCE9_CONFIG;
    if (!cfg) {
      grid.innerHTML = `<div class="error">
        <strong>Config not loaded.</strong><br><br>
        Make sure <code>science-config.js</code> is in the <strong>same folder</strong> as this HTML file.<br>
        And that it defines <code>window.SCIENCE9_CONFIG</code>.
      </div>`;
      return;
    }

    let html = '';
    let count = 0;

    cfg.chapters.forEach(ch => {
      (ch.topics || []).forEach(tp => {
        (tp.concepts || []).forEach(cn => {
          const d = D[cn.id];
          if (!d) return;
          count++;
          const color = ch.color || '#ff9ec0';
          html += `
            <article class="card" style="box-shadow: 0 0 0 1px ${color}33, 0 14px 30px -14px #000">
              <h3>${esc(cn.display_name.english)}</h3>
              <div class="concept">${esc(ch.display_name.english)}</div>
              <div class="svg-box">${d.svg}</div>
              <div class="caption">${esc(d.tag)}</div>
              <span class="tag" style="background:${color}22;border:1px solid ${color}66;color:${color}">${color.toUpperCase()}</span>
            </article>`;
        });
      });
    });

    if (count === 0) {
      grid.innerHTML = `<div class="error">No diagrams matched the config IDs.</div>`;
      return;
    }

    grid.innerHTML = html;

    // ensure every SVG scales properly on mobile
    document.querySelectorAll('.svg-box svg').forEach(svg => {
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      svg.style.width = '100%';
      svg.style.height = 'auto';
      svg.style.maxWidth = '100%';
      svg.style.display = 'block';
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // Wait for config script (it loads synchronously before this, but be safe)
  if (window.SCIENCE9_CONFIG) {
    render();
  } else {
    window.addEventListener('load', render);
    setTimeout(render, 500);
  }
})();
</script>
